services:
  api:
    container_name: data-sync-api
    build:
      context: .
      dockerfile: Dockerfile
    # Die API bleibt nur im internen Compose-Netz erreichbar.
    expose:
      - "8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      EnableHttpsEndpoint: "false"
      EnableHttpsRedirection: "false"
      # Kestrel lauscht nur intern, Caddy uebernimmt HTTPS nach aussen.
      ServerEndpoints__Http__Url: http://0.0.0.0:8080
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ./uploads:/app/uploads
    restart: unless-stopped
    networks:
      - proxy-network
      - database-network

  caddy:
    container_name: data-sync-caddy
    image: caddy:2
    depends_on:
      - api
    ports:
      # Nicht-Standard-Port fuer HTTP im lokalen Netz.
      - "${CADDY_HTTP_PORT:-8088}:8080"
      # Nicht-Standard-Port fuer HTTPS im lokalen Netz.
      - "${CADDY_HTTPS_PORT:-8443}:8443"
    environment:
      # Diese IP muss zur LAN-IP des Docker-Hosts passen.
      CADDY_PUBLIC_IP: ${CADDY_PUBLIC_IP}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    networks:
      - proxy-network

volumes:
  caddy_data:
  caddy_config:

networks:
  proxy-network:
  database-network:
    external: true
    name: ${DB_NETWORK_NAME}
