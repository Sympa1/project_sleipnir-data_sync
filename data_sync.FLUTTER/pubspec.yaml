# Projekt-Metadaten
# Der Name wird als App-Identifier verwendet
name: data_sync_flutter
description: "A new Flutter project."

# publish_to: 'none' verhindert, dass das Projekt auf pub.dev veröffentlicht wird
# Das ist wichtig für private Projekte, die nicht für andere Entwickler gedacht sind
publish_to: 'none'

# Versionierung: major.minor.patch+build_number
# Beispiel: 1.0.0+1 = Version 1.0.0, Build-Nummer 1
# Diese Version wird im App-Store und beim Release verwendet
# Die Nummer nach dem + ist die interne Build-Nummer (wird bei jedem Build erhöht)
version: 1.0.0+1

# Festlegung der Dart/Flutter SDK Version für dieses Projekt
# ^3.11.0 bedeutet: "Version 3.11.0 oder neuer, aber nicht 4.0"
# Das ^ Symbol schützt vor Breaking Changes in neuen Hauptversionen
environment:
  sdk: ^3.11.0

# DEPENDENCIES (Abhängigkeiten) - Pakete, die deine App braucht um zu funktionieren
# Diese sind immer im Paket enthalten, wenn deine App verteilt wird
dependencies:
  flutter:
    sdk: flutter

  # Icon-Bibliothek für iOS-Style Icons (Cupertino Design)
  cupertino_icons: ^1.0.8
  
  # SQLite Datenbankzugriff - wird zum Speichern von Einstellungen und Logs verwendet
  # Ermöglicht lokale Datenbank ohne Internet-Verbindung
  sqflite: ^2.3.0
  
  # Path Provider - ermöglicht Zugriff auf Systemverzeichnisse (Dokumentspeicher, Temp, etc.)
  # Wird genutzt um den Pfad für die SQLite-Datenbankdatei zu bestimmen
  path_provider: ^2.1.0
  
  # Path - utility Funktionen für Dateipfade
  # Wird genutzt um Dateipfade korrekt zu kombinieren (plattformunabhängig)
  path: ^1.9.0
  file_picker: ^10.3.10

# DEV_DEPENDENCIES - Pakete nur für die Entwicklung (nicht in Release-Build enthalten)
# Diese brauchst du während der Entwicklung, aber nicht wenn andere deine App nutzen
dev_dependencies:
  flutter_test:
    sdk: flutter

  # Code-Analyse Tool - prüft auf Best Practices und Style-Probleme
  flutter_lints: ^6.0.0
  
  # Generiert App-Icons aus einer PNG-Datei für alle Plattformen
  flutter_launcher_icons: ^0.13.1

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# FLUTTER-SPEZIFISCHE KONFIGURATION
# Dieser Abschnitt definiert, welche Flutter-Features und Assets deine App braucht
flutter:

  # Material Design Icons aktivieren
  # uses-material-design: true ermöglicht die Material Icons Font (Icons.download, Icons.upload, etc.)
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,

# flutter_launcher_icons Konfiguration
# Konvertiert eine PNG-Datei automatisch in die Icon-Formate aller Plattformen
flutter_launcher_icons:
  # Eingabe-Bild als Quelle für alle Plattformen-Icons
  image_path: "img/final_filled.png"
  
  # Für diese Plattformen Icons generieren
  android: true
  ios: true
  
  # iOS-spezifisch: Removes alpha (Transparenz) für iOS Kompatibilität
  remove_alpha_ios: true
  
  # Adaptive Icon für Android (verschiedene Bildschirm-Größen)
  adaptive_icon_background: "#1f636a"
  adaptive_icon_foreground: "img/final_adaptive_fg.png"
